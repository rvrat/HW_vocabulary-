
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Homework Vocabulary Trainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* ============ ПЕРЕМЕННЫЕ ТЕМЫ ============ */
:root{
  --bg:#12141a;
  --bg-grain:#161923;
  --surface:#1c2029;
  --surface-2:#242936;
  --border:#2b3040;
  --border-soft:#232733;
  --text:#eef0f5;
  --text-dim:#9aa1b2;
  --text-faint:#5b6274;
  --gold:#e0b04a;
  --gold-dim:#8a7130;
  --good:#4ade80;
  --good-dim:#1e3a2a;
  --bad:#f87171;
  --bad-dim:#3a1e20;
  --shadow: 0 20px 60px -20px rgba(0,0,0,.6);
  --card-radius: 6px;
  --font-display: 'Fraunces', Georgia, serif;
  --font-body: 'Inter', -apple-system, sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
}
[data-theme="light"]{
  --bg:#f4f1ea;
  --bg-grain:#efece3;
  --surface:#ffffff;
  --surface-2:#faf8f3;
  --border:#e0dccf;
  --border-soft:#e8e4d8;
  --text:#242219;
  --text-dim:#6b6558;
  --text-faint:#a39c8a;
  --gold:#a97a1e;
  --gold-dim:#c99a3e;
  --good:#1f9d55;
  --good-dim:#dcf3e5;
  --bad:#d63a3a;
  --bad-dim:#fbe2e2;
  --shadow: 0 20px 50px -25px rgba(60,50,20,.35);
}

*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  background:
    radial-gradient(ellipse 900px 500px at 50% -10%, var(--bg-grain), transparent),
    var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  min-height:100vh;
  overflow-x:hidden;
  transition:background .35s ease, color .35s ease;
}

/* ============ ВЕРХНЯЯ ПАНЕЛЬ ============ */
.topbar{
  display:flex; align-items:center; gap:18px;
  padding:16px 24px;
  border-bottom:1px solid var(--border-soft);
  background:color-mix(in srgb, var(--surface) 60%, transparent);
  backdrop-filter:blur(10px);
  position:sticky; top:0; z-index:30;
  flex-wrap:wrap;
}
.brand{
  display:flex; align-items:baseline; gap:8px;
  font-family:var(--font-display);
  font-weight:600; font-size:20px; letter-spacing:.2px;
  white-space:nowrap;
}
.brand .mark{
  font-size:12px; font-family:var(--font-mono); color:var(--gold);
  border:1px solid var(--gold-dim); border-radius:3px; padding:2px 5px;
  letter-spacing:1px;
}
.topbar-spacer{flex:1;}
.block-select-wrap{position:relative;}
select#blockSelect{
  appearance:none; -webkit-appearance:none;
  background:var(--surface-2); color:var(--text);
  border:1px solid var(--border); border-radius:5px;
  padding:9px 34px 9px 12px; font-family:var(--font-body); font-size:13.5px; font-weight:500;
  cursor:pointer; min-width:230px;
}
.block-select-wrap::after{
  content:"▾"; position:absolute; right:12px; top:50%; transform:translateY(-50%);
  color:var(--text-dim); pointer-events:none; font-size:11px;
}
.overall-progress{
  display:flex; flex-direction:column; gap:4px; min-width:170px;
}
.overall-progress .label{font-size:11px; color:var(--text-faint); font-family:var(--font-mono); letter-spacing:.5px; text-transform:uppercase;}
.overall-progress .bar{height:5px; background:var(--surface-2); border-radius:3px; overflow:hidden; border:1px solid var(--border-soft);}
.overall-progress .bar-fill{height:100%; background:linear-gradient(90deg, var(--gold-dim), var(--gold)); transition:width .5s ease;}
.overall-progress .num{font-size:12px; color:var(--text-dim); font-family:var(--font-mono);}

.icon-btn{
  width:38px; height:38px; border-radius:50%;
  border:1px solid var(--border); background:var(--surface-2); color:var(--text);
  display:flex; align-items:center; justify-content:center;
  cursor:pointer; font-size:16px; transition:all .2s ease; flex-shrink:0;
}
.icon-btn:hover{border-color:var(--gold); color:var(--gold); transform:translateY(-1px);}

/* ============ ГЛАВНАЯ ОБЛАСТЬ ============ */
.main{
  display:flex; flex-direction:column; align-items:center;
  padding:48px 20px 80px;
  min-height:calc(100vh - 72px);
}
.round-indicator{
  font-family:var(--font-mono); font-size:12px; letter-spacing:1.5px;
  color:var(--text-faint); text-transform:uppercase; margin-bottom:22px;
  display:flex; align-items:center; gap:10px;
}
.round-indicator .dotline{display:flex; gap:4px;}
.round-indicator .dotline span{width:5px; height:5px; border-radius:50%; background:var(--border);}
.round-indicator .dotline span.done{background:var(--gold);}
.round-indicator .dotline span.current{background:var(--text); box-shadow:0 0 0 3px color-mix(in srgb, var(--gold) 25%, transparent);}

/* --- Стопка карточек (эффект колоды) --- */
.card-stack{ position:relative; width:100%; max-width:520px; }
.card-stack::before, .card-stack::after{
  content:""; position:absolute; left:50%; border-radius:var(--card-radius);
  background:var(--surface); border:1px solid var(--border-soft);
}
.card-stack::before{ width:94%; height:100%; top:10px; transform:translateX(-50%); opacity:.55; z-index:1;}
.card-stack::after{ width:88%; height:100%; top:20px; transform:translateX(-50%); opacity:.3; z-index:0;}

.word-card{
  position:relative; z-index:2;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--card-radius);
  box-shadow:var(--shadow);
  padding:38px 34px 30px;
  min-height:300px;
  display:flex; flex-direction:column; align-items:center; text-align:center;
  animation:cardIn .38s cubic-bezier(.2,.9,.25,1);
}
.word-card::before{ /* перфорация как у карточки каталога */
  content:""; position:absolute; top:0; left:24px; right:24px; height:1px;
  background-image:radial-gradient(circle, var(--border) 1.4px, transparent 1.5px);
  background-size:10px 1px; background-repeat:repeat-x;
  opacity:.8;
}
@keyframes cardIn{
  from{opacity:0; transform:translateY(10px) scale(.98);}
  to{opacity:1; transform:translateY(0) scale(1);}
}
.card-tag{
  font-family:var(--font-mono); font-size:11px; color:var(--text-faint);
  letter-spacing:1px; text-transform:uppercase; margin-bottom:22px;
}
.card-tag b{color:var(--gold-dim); font-weight:600;}
.word-en{
  font-family:var(--font-display); font-weight:600; font-size:clamp(28px,4.2vw,42px);
  line-height:1.15; letter-spacing:.2px;
}
.word-translation{
  margin-top:16px; font-size:17px; color:var(--gold);
  font-family:var(--font-display); font-style:italic; font-weight:500;
  min-height:26px; opacity:0; transform:translateY(4px);
  transition:opacity .25s ease, transform .25s ease;
}
.word-translation.visible{opacity:1; transform:translateY(0);}
.word-example{
  margin-top:10px; font-size:13.5px; color:var(--text-dim);
  max-width:380px; line-height:1.5; opacity:0; height:0; overflow:hidden;
  transition:opacity .25s ease;
}
.word-example.visible{opacity:1; height:auto; margin-top:12px;}

/* --- Цепочка истории ("chain of pearls") --- */
.history-wrap{ margin-top:28px; display:flex; flex-direction:column; align-items:center; gap:9px;}
.history-dots{ position:relative; display:flex; gap:14px; align-items:center; }
.history-dots::before{
  content:""; position:absolute; left:5px; right:5px; top:50%; height:1px;
  background:var(--border); transform:translateY(-50%); z-index:0;
}
.hdot{
  width:11px; height:11px; border-radius:50%; position:relative; z-index:1;
  background:var(--surface-2); border:1.5px solid var(--border);
  transition:all .2s ease;
}
.hdot.know{ background:var(--good); border-color:var(--good); box-shadow:0 0 10px -2px var(--good);}
.hdot.dontknow{ background:var(--bad); border-color:var(--bad); box-shadow:0 0 10px -2px var(--bad);}
.progress-text{ font-family:var(--font-mono); font-size:12px; color:var(--text-faint); letter-spacing:.5px;}

/* ============ КНОПКИ ============ */
.controls{ width:100%; max-width:520px; margin-top:26px; display:flex; flex-direction:column; gap:12px; align-items:center;}
.btn{
  font-family:var(--font-body); font-weight:600; font-size:14.5px;
  padding:13px 24px; border-radius:5px; border:1px solid transparent;
  cursor:pointer; transition:all .18s ease; letter-spacing:.2px;
}
.btn:disabled{opacity:.35; cursor:not-allowed;}
.btn-ghost{
  background:transparent; border-color:var(--border); color:var(--text-dim);
}
.btn-ghost:hover:not(:disabled){ border-color:var(--gold); color:var(--gold);}
.btn-primary{
  background:var(--gold); color:#171308; border-color:var(--gold);
}
.btn-primary:hover:not(:disabled){ filter:brightness(1.08); transform:translateY(-1px);}
.answer-row{ display:flex; gap:12px; width:100%; }
.btn-know, .btn-dontknow{
  flex:1; padding:15px; font-size:15px; border-radius:6px; font-weight:700;
  display:flex; align-items:center; justify-content:center; gap:8px;
}
.btn-know{ background:var(--good-dim); color:var(--good); border:1px solid var(--good);}
.btn-know:hover{ background:var(--good); color:#0b2015; }
.btn-dontknow{ background:var(--bad-dim); color:var(--bad); border:1px solid var(--bad);}
.btn-dontknow:hover{ background:var(--bad); color:#2a0b0b; }
[data-theme="light"] .btn-know:hover{ color:#fff; }
[data-theme="light"] .btn-dontknow:hover{ color:#fff; }

.start-round-area{ margin-top:34px; text-align:center; }
.start-round-area p{ color:var(--text-faint); font-size:13px; margin-top:10px; }

/* --- Экран завершения раунда --- */
.round-summary{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--card-radius);
  padding:40px 34px; text-align:center; max-width:460px; width:100%;
  box-shadow:var(--shadow); animation:cardIn .4s ease;
}
.round-summary h2{ font-family:var(--font-display); font-size:26px; font-weight:600; margin-bottom:6px;}
.round-summary .sub{ color:var(--text-dim); font-size:14px; margin-bottom:26px;}
.summary-stats{ display:flex; justify-content:center; gap:26px; margin-bottom:28px;}
.summary-stat{ display:flex; flex-direction:column; gap:2px;}
.summary-stat .n{ font-family:var(--font-mono); font-size:26px; font-weight:600;}
.summary-stat.good .n{ color:var(--good);}
.summary-stat.bad .n{ color:var(--bad);}
.summary-stat .l{ font-size:11px; color:var(--text-faint); text-transform:uppercase; letter-spacing:.6px;}

.empty-state{ text-align:center; max-width:420px; color:var(--text-dim); }
.empty-state .big{ font-size:44px; margin-bottom:14px; }
.empty-state h3{ font-family:var(--font-display); font-size:22px; color:var(--text); margin-bottom:8px; }

/* ============ БОКОВАЯ ПАНЕЛЬ ============ */
.overlay{
  position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:40;
  opacity:0; pointer-events:none; transition:opacity .3s ease;
}
.overlay.open{ opacity:1; pointer-events:auto; }
.sidebar{
  position:fixed; top:0; right:0; height:100vh; width:380px; max-width:92vw;
  background:var(--surface); border-left:1px solid var(--border);
  z-index:50; transform:translateX(100%); transition:transform .32s cubic-bezier(.2,.9,.25,1);
  overflow-y:auto; padding:22px 22px 60px;
}
.sidebar.open{ transform:translateX(0); }
.sidebar h2{ font-family:var(--font-display); font-size:20px; margin-bottom:18px; display:flex; justify-content:space-between; align-items:center;}
.sidebar-section{ margin-bottom:30px; }
.sidebar-section h3{
  font-family:var(--font-mono); font-size:11px; letter-spacing:1px; text-transform:uppercase;
  color:var(--text-faint); margin-bottom:12px; padding-bottom:8px; border-bottom:1px solid var(--border-soft);
}
.block-row{
  display:flex; flex-direction:column; gap:6px; padding:10px 12px; border-radius:5px;
  border:1px solid var(--border-soft); margin-bottom:8px; cursor:pointer; transition:border-color .2s ease;
}
.block-row:hover{ border-color:var(--gold-dim); }
.block-row.active{ border-color:var(--gold); background:var(--surface-2); }
.block-row-top{ display:flex; justify-content:space-between; font-size:13px; font-weight:600; }
.block-row-top .status{ font-size:11px; color:var(--good); }
.block-bar{ height:4px; background:var(--surface-2); border-radius:2px; overflow:hidden; }
.block-bar-fill{ height:100%; background:var(--gold); }

.field{ display:flex; flex-direction:column; gap:5px; margin-bottom:12px; }
.field label{ font-size:11.5px; color:var(--text-faint); font-weight:600; }
.field input, .field textarea, .field select{
  background:var(--bg); border:1px solid var(--border); border-radius:4px; color:var(--text);
  padding:9px 10px; font-size:13.5px; font-family:var(--font-body); resize:vertical;
}
.slider-row{ display:flex; align-items:center; gap:10px; }
.slider-row input[type=range]{ flex:1; accent-color:var(--gold); }
.slider-val{ font-family:var(--font-mono); font-size:13px; width:24px; text-align:center; }

.btn-block{ width:100%; margin-bottom:8px; text-align:center; }
.btn-danger{ color:var(--bad); border-color:var(--bad-dim); }
.btn-danger:hover{ border-color:var(--bad); background:var(--bad-dim); }

.toast{
  position:fixed; bottom:26px; left:50%; transform:translateX(-50%) translateY(20px);
  background:var(--surface-2); border:1px solid var(--border); color:var(--text);
  padding:12px 20px; border-radius:6px; font-size:13.5px; z-index:100;
  opacity:0; pointer-events:none; transition:all .3s ease; box-shadow:var(--shadow);
}
.toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

.modal-overlay{
  position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:60;
  display:none; align-items:center; justify-content:center; padding:20px;
}
.modal-overlay.open{ display:flex; }
.modal{
  background:var(--surface); border:1px solid var(--border); border-radius:8px;
  padding:26px; max-width:420px; width:100%; box-shadow:var(--shadow);
}
.modal h3{ font-family:var(--font-display); font-size:19px; margin-bottom:16px; }
.modal-actions{ display:flex; gap:10px; margin-top:16px; }
.modal-actions .btn{ flex:1; }

#confettiCanvas{ position:fixed; inset:0; pointer-events:none; z-index:200; }

@media(max-width:640px){
  .topbar{ padding:12px 14px; gap:10px; }
  .overall-progress{ display:none; }
  select#blockSelect{ min-width:0; flex:1; }
  .word-card{ padding:28px 20px 24px; }
}
</style>
</head>
<body data-theme="dark">

<canvas id="confettiCanvas"></canvas>

<!-- ============ ВЕРХНЯЯ ПАНЕЛЬ ============ -->
<header class="topbar">
  <div class="brand">📓 Homework Vocabulary <span class="mark">TRAINER</span></div>
  <div class="topbar-spacer"></div>
  <div class="block-select-wrap">
    <select id="blockSelect"></select>
  </div>
  <div class="overall-progress">
    <span class="label">Общий прогресс</span>
    <div class="bar"><div class="bar-fill" id="overallBarFill"></div></div>
    <span class="num" id="overallNum">Выучено 0/0 слов</span>
  </div>
  <button class="icon-btn" id="themeToggle" title="Сменить тему">🌙</button>
  <button class="icon-btn" id="sidebarToggle" title="Меню блоков">☰</button>
</header>

<!-- ============ ГЛАВНАЯ ОБЛАСТЬ ============ -->
<main class="main" id="mainArea"></main>

<!-- ============ БОКОВАЯ ПАНЕЛЬ ============ -->
<div class="overlay" id="overlay"></div>
<aside class="sidebar" id="sidebar">
  <h2>Блоки <button class="icon-btn" id="sidebarClose" style="width:30px;height:30px;font-size:14px;">✕</button></h2>

  <div class="sidebar-section">
    <h3>Прогресс по блокам</h3>
    <div id="blockList"></div>
  </div>

  <div class="sidebar-section">
    <h3>Повторение</h3>
    <button class="btn btn-ghost btn-block" id="globalReviewBtn">🔁 Повторить все выученные слова</button>
  </div>

  <div class="sidebar-section">
    <h3>Настройки раунда</h3>
    <div class="field">
      <label>Слов в раунде: <span id="roundSizeLabel"></span></label>
      <div class="slider-row">
        <input type="range" id="roundSizeSlider" min="5" max="30" value="10">
      </div>
    </div>
  </div>

  <div class="sidebar-section">
    <h3>Управление словами</h3>
    <button class="btn btn-ghost btn-block" id="openAddWord">➕ Добавить слово</button>
    <button class="btn btn-ghost btn-block" id="openBulkAdd">📋 Добавить список слов</button>
  </div>

  <div class="sidebar-section">
    <h3>Данные</h3>
    <button class="btn btn-ghost btn-block" id="exportBtn">⬇️ Экспорт данных (JSON)</button>
    <button class="btn btn-ghost btn-block" id="importBtn">⬆️ Импорт данных</button>
    <input type="file" id="importFile" accept="application/json" style="display:none;">
  </div>

  <div class="sidebar-section">
    <h3>Сброс прогресса</h3>
    <button class="btn btn-ghost btn-danger btn-block" id="resetBlockBtn">↺ Сбросить прогресс текущего блока</button>
    <button class="btn btn-ghost btn-danger btn-block" id="resetAllBtn">↺ Сбросить весь прогресс</button>
  </div>
</aside>

<!-- ============ МОДАЛКА "ДОБАВИТЬ СЛОВО" ============ -->
<div class="modal-overlay" id="addWordModal">
  <div class="modal">
    <h3>Добавить слово</h3>
    <div class="field">
      <label>Блок</label>
      <select id="newWordBlock"></select>
    </div>
    <div class="field">
      <label>Английское слово / фраза</label>
      <input type="text" id="newWordEn" placeholder="напр. resilient">
    </div>
    <div class="field">
      <label>Перевод</label>
      <input type="text" id="newWordTr" placeholder="напр. стойкий, жизнестойкий">
    </div>
    <div class="field">
      <label>Пример (необязательно)</label>
      <textarea id="newWordEx" rows="2" placeholder="Пример предложения..."></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="cancelAddWord">Отмена</button>
      <button class="btn btn-primary" id="confirmAddWord">Добавить</button>
    </div>
  </div>
</div>

<!-- ============ МОДАЛКА "ДОБАВИТЬ СПИСОК СЛОВ" ============ -->
<div class="modal-overlay" id="bulkAddModal">
  <div class="modal">
    <h3>Добавить список слов</h3>
    <div class="field">
      <label>Блок</label>
      <select id="bulkWordBlock"></select>
    </div>
    <div class="field">
      <label>Список (по одному слову на строку, формат: слово - перевод)</label>
      <textarea id="bulkWordsText" rows="8" placeholder="cat - кошка&#10;dog - собака&#10;resilient - устойчивый, стойкий"></textarea>
    </div>
    <div id="bulkPreview" style="font-size:12.5px; color:var(--text-faint); margin-top:-4px; margin-bottom:8px;"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="cancelBulkAdd">Отмена</button>
      <button class="btn btn-primary" id="confirmBulkAdd">Добавить все</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* =========================================================================
   HOMEWORK VOCABULARY TRAINER
   Полностью автономное веб-приложение на чистом JS.
   ========================================================================= */

/* ---------- 1. ИСХОДНЫЕ ДАННЫЕ: 18 блоков, 359 слов ---------- */
// Формат: [номер блока, английское слово, перевод]
const WORDS_RAW = [
[1,"accomplish feats","совершать подвиги / достигать выдающихся результатов"],[1,"aid worker","сотрудник гуманитарной организации (помощи)"],[1,"applicant","соискатель / претендент (на должность)"],
[1,"aspiration","стремление / цель / мечта"],[1,"authentic","настоящий / подлинный (не подделка)"],[1,"beam","передавать сигнал / транслировать (по телевидению)"],
[1,"become financially independent","стать финансово независимым (не зависеть от родителей)"],[1,"break into the job market","пробиться на рынок труда (устроиться, несмотря на отсутствие опыта)"],[1,"build up","наращивать / укреплять (силу, мышцы)"],

const TOTAL_BLOCKS = 4;
const BLOCK_SIZES = {}; // считаем размер каждого блока по факту
WORDS_RAW.forEach(([b])=>{ BLOCK_SIZES[b]=(BLOCK_SIZES[b]||0)+1; });

function buildBaseWords(){
  return WORDS_RAW.map((row,i)=>({
    id: 'w'+(i+1),
    english: row[1],
    translation: row[2],
    example: '',
    blockId: row[0],
    history: []          // массив последних до 5 ответов: 'know' | 'dontknow'
  }));
}

/* ---------- 2. СОСТОЯНИЕ ПРИЛОЖЕНИЯ ---------- */
// Универсальный слой хранения:
// - если файл открыт внутри Claude (артефакт) — доступен window.storage, используем его
// - если файл открыт как обычный HTML (двойным кликом / в браузере) — используем localStorage
// Это нужно, чтобы прогресс сохранялся в ЛЮБОМ варианте использования файла.
const hasWindowStorage = (typeof window !== 'undefined')
  && window.storage
  && typeof window.storage.get === 'function'
  && typeof window.storage.set === 'function';

async function storageGetRaw(key){
  if(hasWindowStorage){
    try{
      const res = await window.storage.get(key, false);
      return (res && typeof res.value === 'string') ? res.value : null;
    }catch(e){
      return null; // ключа ещё нет — это нормально при первом запуске
    }
  }
  try{
    return localStorage.getItem(key);
  }catch(e){
    console.error('localStorage недоступен:', e);
    return null;
  }
}
async function storageSetRaw(key, value){
  if(hasWindowStorage){
    try{
      const result = await window.storage.set(key, value, false);
      return !!result;
    }catch(e){
      console.error('Ошибка window.storage.set:', e);
      return false;
    }
  }
  try{
    localStorage.setItem(key, value);
    return true;
  }catch(e){
    console.error('Ошибка localStorage.setItem:', e);
    return false;
  }
}

const STORAGE_WORDS = 'hwVocab_words_v1';
const STORAGE_SETTINGS = 'hwVocab_settings_v1';

let state = {
  words: [],
  settings: { roundSize: 10, currentBlock: 1, theme: 'dark' },
  round: null // {wordIds:[], index:0, revealed:false, correct:0, wrong:0, mode:'new'|'review'}
};

async function loadData(){
  const rawWords = await storageGetRaw(STORAGE_WORDS);
  try{
    state.words = rawWords ? JSON.parse(rawWords) : buildBaseWords();
  }catch(e){
    state.words = buildBaseWords();
  }
  const rawSettings = await storageGetRaw(STORAGE_SETTINGS);
  if(rawSettings){
    try{ state.settings = Object.assign(state.settings, JSON.parse(rawSettings)); }
    catch(e){ /* повреждённые настройки — используем значения по умолчанию */ }
  }
  await mergeNewBaseWords();
}

// Если в коде появились новые "родные" слова (новые блоки/слова, добавленные Claude),
// добавляем их к уже сохранённому прогрессу пользователя, НЕ трогая существующую историю.
// Если текст существующего слова (английское слово/перевод) отредактирован в коде —
// синхронизируем текст, но история ответов (прогресс) остаётся нетронутой.
// Слова, добавленные самим пользователем вручную, никогда не совпадают по id (у них id вида 'w'+timestamp),
// поэтому не задеваются.
async function mergeNewBaseWords(){
  const base = buildBaseWords();
  const existingById = new Map(state.words.map(w => [w.id, w]));
  let added = 0, updated = 0;
  base.forEach(bw => {
    const existing = existingById.get(bw.id);
    if(!existing){
      state.words.push(bw);
      added++;
    }else if(existing.english !== bw.english || existing.translation !== bw.translation){
      existing.english = bw.english;
      existing.translation = bw.translation;
      updated++;
    }
  });
  if(added > 0 || updated > 0){
    await saveWords();
    const parts = [];
    if(added) parts.push(`добавлено слов: ${added}`);
    if(updated) parts.push(`обновлены переводы: ${updated}`);
    showToast(parts.join(', '));
  }
}
async function saveWords(){
  const ok = await storageSetRaw(STORAGE_WORDS, JSON.stringify(state.words));
  if(!ok) showToast('⚠️ Не удалось сохранить прогресс');
}
async function saveSettings(){
  await storageSetRaw(STORAGE_SETTINGS, JSON.stringify(state.settings));
}

/* ---------- 3. ЛОГИКА ИЗУЧЕНИЯ ---------- */
function isLearned(word){
  return word.history.length === 5 && word.history.every(h => h === 'know');
}
function wordsInBlock(blockId){ return state.words.filter(w => w.blockId === blockId); }
function learnedWordsInBlock(blockId){ return wordsInBlock(blockId).filter(isLearned); }
function learnedCountInBlock(blockId){ return learnedWordsInBlock(blockId).length; }
function totalLearned(){ return state.words.filter(isLearned).length; }

function recordAnswer(word, known){
  word.history.push(known ? 'know' : 'dontknow');
  if(word.history.length > 5) word.history.shift();
  saveWords();
}

/* ---------- 4. РЕНДЕР: ВЕРХНЯЯ ПАНЕЛЬ ---------- */
function renderTopbar(){
  const select = document.getElementById('blockSelect');
  select.innerHTML = '';
  for(let b=1; b<=TOTAL_BLOCKS; b++){
    const learned = learnedCountInBlock(b);
    const total = BLOCK_SIZES[b];
    const opt = document.createElement('option');
    opt.value = b;
    opt.textContent = `Блок ${b} — Выучено ${learned}/${total}`;
    if(b === state.settings.currentBlock) opt.selected = true;
    select.appendChild(opt);
  }
  const learnedTotal = totalLearned();
  const wordsTotal = state.words.length;
  document.getElementById('overallNum').textContent = `Выучено ${learnedTotal}/${wordsTotal} слов`;
  document.getElementById('overallBarFill').style.width = (wordsTotal? (learnedTotal/wordsTotal*100):0) + '%';
}

/* ---------- 5. РЕНДЕР: БОКОВАЯ ПАНЕЛЬ ---------- */
function renderSidebar(){
  const list = document.getElementById('blockList');
  list.innerHTML = '';
  for(let b=1; b<=TOTAL_BLOCKS; b++){
    const learned = learnedCountInBlock(b);
    const total = BLOCK_SIZES[b];
    const row = document.createElement('div');
    row.className = 'block-row' + (b === state.settings.currentBlock ? ' active' : '');
    row.innerHTML = `
      <div class="block-row-top">
        <span>Блок ${b}</span>
        <span class="status">${learned}/${total}${learned===total?' ✅':''}</span>
      </div>
      <div class="block-bar"><div class="block-bar-fill" style="width:${total? (learned/total*100):0}%"></div></div>
    `;
    row.addEventListener('click', ()=>{
      state.settings.currentBlock = b;
      saveSettings();
      state.round = null;
      renderAll();
      closeSidebar();
    });
    list.appendChild(row);
  }

  const maxBlockSize = Math.max(...Object.values(BLOCK_SIZES), 20);
  const slider = document.getElementById('roundSizeSlider');
  slider.max = maxBlockSize;
  slider.value = state.settings.roundSize;
  document.getElementById('roundSizeLabel').textContent = state.settings.roundSize;

  const allLearnedCount = state.words.filter(isLearned).length;
  const globalReviewBtn = document.getElementById('globalReviewBtn');
  globalReviewBtn.textContent = `🔁 Повторить все выученные слова (${allLearnedCount})`;
  globalReviewBtn.disabled = allLearnedCount === 0;

  const newWordBlockSelect = document.getElementById('newWordBlock');
  newWordBlockSelect.innerHTML = '';
  for(let b=1; b<=TOTAL_BLOCKS; b++){
    const opt = document.createElement('option');
    opt.value = b; opt.textContent = 'Блок ' + b;
    if(b === state.settings.currentBlock) opt.selected = true;
    newWordBlockSelect.appendChild(opt);
  }

  const bulkWordBlockSelect = document.getElementById('bulkWordBlock');
  bulkWordBlockSelect.innerHTML = '';
  for(let b=1; b<=TOTAL_BLOCKS; b++){
    const opt = document.createElement('option');
    opt.value = b; opt.textContent = 'Блок ' + b;
    if(b === state.settings.currentBlock) opt.selected = true;
    bulkWordBlockSelect.appendChild(opt);
  }
}

/* ---------- 6. РЕНДЕР: ГЛАВНАЯ ОБЛАСТЬ ---------- */
function renderAll(){
  renderTopbar();
  renderSidebar();
  renderMain();
}

function renderMain(){
  const main = document.getElementById('mainArea');
  main.innerHTML = '';

  const blockId = state.settings.currentBlock;
  const blockWords = wordsInBlock(blockId);
  const unlearned = blockWords.filter(w => !isLearned(w));

  // --- Идёт раунд ---
  if(state.round && !state.round.finished){
    main.appendChild(renderRoundCard());
    return;
  }

  // --- Раунд только что завершён ---
  if(state.round && state.round.finished){
    main.appendChild(renderRoundSummary());
    return;
  }

  const learnedCount = learnedCountInBlock(blockId);

  // --- Все слова блока выучены ---
  if(unlearned.length === 0){
    const wrap = document.createElement('div');
    wrap.className = 'empty-state';
    wrap.innerHTML = `
      <div class="big">🏆</div>
      <h3>Блок ${blockId} полностью выучен!</h3>
      <p>Все ${blockWords.length} слов в этом блоке выучены наизусть. Можно повторить их ещё раз, выбрать другой блок или сбросить прогресс.</p>
      <button class="btn btn-primary" id="reviewBtn" style="margin-top:22px;">🔁 Повторить выученные (${learnedCount})</button>
    `;
    main.appendChild(wrap);
    document.getElementById('reviewBtn').addEventListener('click', ()=>startRound('review'));
    return;
  }

  // --- Экран "Начать раунд" ---
  const wrap = document.createElement('div');
  wrap.className = 'start-round-area';
  const roundSize = Math.min(state.settings.roundSize, unlearned.length);
  wrap.innerHTML = `
    <div class="empty-state">
      <div class="big">📖</div>
      <h3>Блок ${blockId}</h3>
      <p>Не выучено слов: ${unlearned.length} из ${blockWords.length}</p>
    </div>
    <button class="btn btn-primary" id="startRoundBtn" style="margin-top:22px;">Начать раунд (${roundSize} слов)</button>
    ${learnedCount > 0 ? `<button class="btn btn-ghost" id="reviewBtn" style="margin-top:12px;">🔁 Повторить выученные (${learnedCount})</button>` : ''}
  `;
  main.appendChild(wrap);
  document.getElementById('startRoundBtn').addEventListener('click', ()=>startRound('new'));
  if(learnedCount > 0) document.getElementById('reviewBtn').addEventListener('click', ()=>startRound('review'));
}

function renderRoundCard(){
  const r = state.round;
  const word = state.words.find(w => w.id === r.wordIds[r.index]);
  const container = document.createElement('div');
  container.style.width = '100%';
  container.style.display = 'flex';
  container.style.flexDirection = 'column';
  container.style.alignItems = 'center';

  // индикатор раунда (мини-точки)
  const dotsHtml = r.wordIds.map((_,i)=>{
    let cls = '';
    if(i < r.index) cls = 'done';
    else if(i === r.index) cls = 'current';
    return `<span class="${cls}"></span>`;
  }).join('');

  const indicator = document.createElement('div');
  indicator.className = 'round-indicator';
  indicator.innerHTML = `Слово ${r.index+1} из ${r.wordIds.length} <span class="dotline">${dotsHtml}</span>`;
  container.appendChild(indicator);

  const stack = document.createElement('div');
  stack.className = 'card-stack';

  const card = document.createElement('div');
  card.className = 'word-card';

  const historyDots = word.history.map(h => `<span class="hdot ${h==='know'?'know':'dontknow'}"></span>`).join('')
    + Array(5 - word.history.length).fill('<span class="hdot"></span>').join('');

  const correctStreak = word.history.filter(h=>h==='know').length;

  card.innerHTML = `
    <div class="card-tag">Блок <b>${String(word.blockId).padStart(2,'0')}</b> · ${r.mode === 'review' ? '🔁 повторение' : r.mode === 'globalReview' ? '🔁 общее повторение' : 'изучение'}</div>
    <div class="word-en">${escapeHtml(word.english)}</div>
    <div class="word-translation" id="translationEl">${escapeHtml(word.translation)}</div>
    ${word.example ? `<div class="word-example" id="exampleEl">${escapeHtml(word.example)}</div>` : ''}
    <div class="history-wrap">
      <div class="history-dots">${historyDots}</div>
      <div class="progress-text">Прогресс: ${correctStreak}/5</div>
    </div>
  `;
  stack.appendChild(card);
  container.appendChild(stack);

  const controls = document.createElement('div');
  controls.className = 'controls';
  controls.innerHTML = `
    <button class="btn btn-ghost" id="showTranslationBtn">Показать перевод</button>
    <div class="answer-row">
      <button class="btn-know" id="knowBtn">✅ Знаю</button>
      <button class="btn-dontknow" id="dontknowBtn">❌ Не знаю</button>
    </div>
  `;
  container.appendChild(controls);

  // перевод/пример скрыты, пока не нажата кнопка
  requestAnimationFrame(()=>{
    document.getElementById('showTranslationBtn').addEventListener('click', ()=>{
      document.getElementById('translationEl').classList.add('visible');
      const ex = document.getElementById('exampleEl');
      if(ex) ex.classList.add('visible');
    });
    document.getElementById('knowBtn').addEventListener('click', ()=>submitAnswer(true));
    document.getElementById('dontknowBtn').addEventListener('click', ()=>submitAnswer(false));
  });

  return container;
}

function renderRoundSummary(){
  const r = state.round;
  const wrap = document.createElement('div');
  wrap.className = 'round-summary';
  const subtitle = r.mode === 'globalReview'
    ? 'Общее повторение всех выученных слов'
    : r.mode === 'review'
    ? `Блок ${state.settings.currentBlock} · повторение выученных слов`
    : `Блок ${state.settings.currentBlock}`;
  wrap.innerHTML = `
    <h2>Раунд завершён!</h2>
    <div class="sub">${subtitle}</div>
    <div class="summary-stats">
      <div class="summary-stat good"><span class="n">${r.correct}</span><span class="l">Знаю</span></div>
      <div class="summary-stat bad"><span class="n">${r.wrong}</span><span class="l">Не знаю</span></div>
    </div>
    <button class="btn btn-primary" id="continueBtn">Продолжить</button>
  `;
  requestAnimationFrame(()=>{
    document.getElementById('continueBtn').addEventListener('click', ()=>{
      state.round = null;
      renderAll();
    });
  });
  return wrap;
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

/* ---------- 7. ЛОГИКА РАУНДА ---------- */
// mode: 'new' — только невыученные слова текущего блока
//       'review' — повтор уже выученных слов ТЕКУЩЕГО блока
//       'globalReview' — повтор уже выученных слов ИЗ ВСЕХ БЛОКОВ
function startRound(mode){
  mode = mode || 'new';
  const blockId = state.settings.currentBlock;
  let pool;
  if(mode === 'globalReview'){
    pool = state.words.filter(isLearned);
  } else if(mode === 'review'){
    pool = learnedWordsInBlock(blockId);
  } else {
    pool = wordsInBlock(blockId).filter(w => !isLearned(w));
  }

  if(pool.length === 0){
    const msg = mode === 'globalReview' ? 'Нет выученных слов для повторения'
      : mode === 'review' ? 'Нет выученных слов для повторения'
      : 'Все слова блока уже выучены';
    showToast(msg);
    return;
  }

  // В режиме "повторить все выученные" берём ВСЕ слова пула целиком,
  // не ограничивая ползунком "слов в раунде" — это отдельный полный прогон.
  const size = mode === 'globalReview' ? pool.length : Math.min(state.settings.roundSize, pool.length);
  const shuffled = [...pool].sort(()=>Math.random()-0.5).slice(0, size);
  state.round = {
    wordIds: shuffled.map(w=>w.id),
    index: 0,
    correct: 0,
    wrong: 0,
    finished: false,
    mode: mode
  };
  renderAll();
}

function submitAnswer(known){
  const r = state.round;
  const word = state.words.find(w => w.id === r.wordIds[r.index]);
  const wasLearnedBefore = isLearned(word);
  recordAnswer(word, known);
  if(known) r.correct++; else r.wrong++;

  const wordBlockId = word.blockId; // используем блок самого слова, а не текущий выбранный блок —
                                     // это важно для режима "повторить все выученные", где слова из разных блоков
  const nowLearned = isLearned(word);
  const blockFullyLearnedNow = !wasLearnedBefore && nowLearned && (learnedCountInBlock(wordBlockId) === BLOCK_SIZES[wordBlockId]);

  r.index++;
  if(r.index >= r.wordIds.length){
    r.finished = true;
  }
  renderAll();

  if(blockFullyLearnedNow){
    launchConfetti();
    showToast('🎉 Блок ' + wordBlockId + ' полностью выучен!');
  }
}

/* ---------- 8. ЭКСПОРТ / ИМПОРТ ---------- */
function exportData(){
  const data = { words: state.words, settings: state.settings, exportedAt: new Date().toISOString() };
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'sat-vocab-progress.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('Данные экспортированы');
}
function importData(file){
  const reader = new FileReader();
  reader.onload = (e)=>{
    try{
      const data = JSON.parse(e.target.result);
      if(data.words && Array.isArray(data.words)){
        state.words = data.words;
        if(data.settings) state.settings = Object.assign(state.settings, data.settings);
        saveWords(); saveSettings();
        state.round = null;
        renderAll();
        showToast('Данные успешно импортированы');
      }else{
        showToast('Неверный формат файла');
      }
    }catch(err){
      showToast('Ошибка при чтении файла');
    }
  };
  reader.readAsText(file);
}

/* ---------- 9. СБРОС ПРОГРЕССА ---------- */

/* ---------- 10. ДОБАВЛЕНИЕ СЛОВА ---------- */
function addWord(){
  const block = parseInt(document.getElementById('newWordBlock').value, 10);
  const en = document.getElementById('newWordEn').value.trim();
  const tr = document.getElementById('newWordTr').value.trim();
  const ex = document.getElementById('newWordEx').value.trim();
  if(!en || !tr){ showToast('Заполните слово и перевод'); return; }
  const newId = 'w' + Date.now();
  state.words.push({ id:newId, english:en, translation:tr, example:ex, blockId:block, history:[] });
  BLOCK_SIZES[block] = (BLOCK_SIZES[block]||0) + 1;
  saveWords();
  document.getElementById('newWordEn').value = '';
  document.getElementById('newWordTr').value = '';
  document.getElementById('newWordEx').value = '';
  closeModal();
  renderAll();
  showToast('Слово добавлено');
}

/* ---------- 10b. МАССОВОЕ ДОБАВЛЕНИЕ СЛОВ (списком, через дефис) ---------- */
// Формат строки: "английское слово - перевод" (дефис с пробелами или без)
function parseBulkWords(text){
  const lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 0);
  const parsed = [];
  const invalid = [];
  lines.forEach(line => {
    let en, tr;
    const idxSpaced = line.indexOf(' - ');
    if(idxSpaced !== -1){
      en = line.slice(0, idxSpaced).trim();
      tr = line.slice(idxSpaced + 3).trim();
    }else{
      const idxPlain = line.indexOf('-');
      if(idxPlain === -1){ invalid.push(line); return; }
      en = line.slice(0, idxPlain).trim();
      tr = line.slice(idxPlain + 1).trim();
    }
    if(!en || !tr){ invalid.push(line); return; }
    parsed.push({ english: en, translation: tr });
  });
  return { parsed, invalid };
}

function updateBulkPreview(){
  const text = document.getElementById('bulkWordsText').value;
  const preview = document.getElementById('bulkPreview');
  if(!text.trim()){ preview.textContent = ''; return; }
  const { parsed, invalid } = parseBulkWords(text);
  let msg = `Распознано слов: ${parsed.length}`;
  if(invalid.length) msg += ` · не удалось разобрать строк: ${invalid.length}`;
  preview.textContent = msg;
}

function addBulkWords(){
  const block = parseInt(document.getElementById('bulkWordBlock').value, 10);
  const text = document.getElementById('bulkWordsText').value;
  const { parsed, invalid } = parseBulkWords(text);
  if(parsed.length === 0){
    showToast('Не найдено ни одного слова в списке. Формат: слово - перевод');
    return;
  }
  parsed.forEach((item, i) => {
    const newId = 'w' + Date.now() + '_' + i;
    state.words.push({ id:newId, english:item.english, translation:item.translation, example:'', blockId:block, history:[] });
    BLOCK_SIZES[block] = (BLOCK_SIZES[block]||0) + 1;
  });
  saveWords();
  document.getElementById('bulkWordsText').value = '';
  document.getElementById('bulkPreview').textContent = '';
  closeBulkModal();
  renderAll();
  showToast(`Добавлено слов: ${parsed.length}` + (invalid.length ? `, пропущено строк: ${invalid.length}` : ''));
}

/* ---------- 11. ВСПОМОГАТЕЛЬНЫЕ UI-ФУНКЦИИ ---------- */
let toastTimer;
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> t.classList.remove('show'), 2600);
}
function openSidebar(){ document.getElementById('sidebar').classList.add('open'); document.getElementById('overlay').classList.add('open'); }

/* ---------- 12. ТЕМА ---------- */
function applyTheme(){
  document.body.setAttribute('data-theme', state.settings.theme);
  document.getElementById('themeToggle').textContent = state.settings.theme === 'dark' ? '🌙' : '☀️';
}
function toggleTheme(){
  state.settings.theme = state.settings.theme === 'dark' ? 'light' : 'dark';
  saveSettings();
  applyTheme();
}

/* ---------- 13. КОНФЕТТИ ---------- */
function launchConfetti(){
  const canvas = document.getElementById('confettiCanvas');
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth; canvas.height = window.innerHeight;
  const colors = ['#e0b04a','#4ade80','#f87171','#eef0f5','#8a7130'];
  const particles = Array.from({length:140}, ()=>({
    x: Math.random()*canvas.width,
    y: -20 - Math.random()*canvas.height*0.4,
    r: 4 + Math.random()*5,
    color: colors[Math.floor(Math.random()*colors.length)],
    vy: 2 + Math.random()*3,
    vx: -1.5 + Math.random()*3,
    rot: Math.random()*360,
    vrot: -6 + Math.random()*12
  }));
  let frame = 0;
  function tick(){
    frame++;
    ctx.clearRect(0,0,canvas.width,canvas.height);
    particles.forEach(p=>{
      p.x += p.vx; p.y += p.vy; p.rot += p.vrot;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot * Math.PI/180);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.r/2, -p.r/2, p.r, p.r*1.6);
      ctx.restore();
    });
    if(frame < 160){ requestAnimationFrame(tick); }
    else{ ctx.clearRect(0,0,canvas.width,canvas.height); }
  }
  tick();
}

/* ---------- 14. ИНИЦИАЛИЗАЦИЯ И СЛУШАТЕЛИ ---------- */

  document.getElementById('mainArea').innerHTML = `
    <div class="empty-state">
      <div class="big">⏳</div>
      <h3>Загружаем прогресс…</h3>
    </div>`;

  attachEventListeners();

  await loadData();
  applyTheme();
  renderAll();
}

    state.round = null;

  });

  document.getElementById('themeToggle').addEventListener('click', toggleTheme);
  document.getElementById('sidebarToggle').addEventListener('click', openSidebar);
  document.getElementById('sidebarClose').addEventListener('click', closeSidebar);
  document.getElementById('overlay').addEventListener('click', closeSidebar);

  document.getElementById('roundSizeSlider').addEventListener('input', (e)=>{

  });
  document.getElementById('roundSizeSlider').addEventListener('change', renderMain);

  document.getElementById('openAddWord').addEventListener('click', openModal);

  document.getElementById('addWordModal').addEventListener('click', (e)=>{
    if(e.target.id === 'addWordModal') closeModal();
  });

  document.getElementById('openBulkAdd').addEventListener('click', openBulkModal);

  document.getElementById('confirmBulkAdd').addEventListener('click', addBulkWords);
  document.getElementById('bulkWordsText').addEventListener('input', updateBulkPreview);
  document.getElementById('bulkAddModal').addEventListener('click', (e)=>{
    if(e.target.id === 'bulkAddModal') closeBulkModal();
  });

  document.getElementById('globalReviewBtn').addEventListener('click', ()=>{
    startRound('globalReview');
    closeSidebar();
  });

  document.getElementById('exportBtn').addEventListener('click', exportData);
  document.getElementById('importBtn').addEventListener('click', ()=> document.getElementById('importFile').click());
  document.getElementById('importFile').addEventListener('change', (e)=>{
    if(e.target.files[0]) importData(e.target.files[0]);

  });

  document.getElementById('resetBlockBtn').addEventListener('click', ()=>{
    if(confirm(`Сбросить прогресс блока ${state.settings.currentBlock}?`)){
      resetBlockProgress(state.settings.currentBlock);
    }
  });
  document.getElementById('resetAllBtn').addEventListener('click', ()=>{
    if(confirm('Сбросить ВЕСЬ прогресс по всем блокам? Это действие необратимо.')){
      resetAllProgress();
    }
  });

  window.addEventListener('resize', ()=>{
    const canvas = document.getElementById('confettiCanvas');
    canvas.width = window.innerWidth; canvas.height = window.innerHeight;
  });
}

init();
</script>
